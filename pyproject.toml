[project]
name = "research-output-claims"
version = "0.1.0"
description = "Research output ingestion, attribution, and reporting"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2.8,<5.3",
    "gunicorn>=23,<27; sys_platform != 'win32'",
    "psycopg[binary]>=3.2.11,<4",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-django>=4.11,<5", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
