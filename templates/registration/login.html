{% extends 'base.html' %}
{% block title %}登录 · 学术成果归集{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">工作台账户</p>
  <h1>登录</h1>
  <form method="post" class="stack">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">登录</button>
  </form>
</section>
{% endblock %}
