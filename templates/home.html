{% extends 'base.html' %}
{% block content %}
<section class="hero">
  <p class="eyebrow">科研成果 · 证据与归属</p>
  <h1>学术成果智能归集与认领系统</h1>
  <p>从论文和专利的增量归集，到教师认领、独立复核和可追溯统计。</p>

  <article><h2>解释统计</h2><p>按成果事件和历史院系切换示例口径，核对明细与快照。</p></article>
</section>
